<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streak Goblin</title>
<style>
:root{--bg:#f7f3ed;--card:#fff;--ink:#29252d;--muted:#756e77;--purple:#7046a5;--red:#b83d3d;--green:#2f8b59;--line:#e4ddd5;--header:#292330}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:auto;padding:16px}header{background:var(--header);color:#fff;padding:17px;border-radius:15px;margin-bottom:14px}h1{margin:0;font-size:24px}h2{margin:0 0 6px}h3{margin:15px 0 7px}
button{border:0;border-radius:9px;padding:9px 12px;background:var(--purple);color:#fff;font-weight:700;cursor:pointer;margin:3px}
button.secondary{background:#e9e2ed;color:#34283c}button.danger{background:var(--red)}button.small{padding:6px 9px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #00000008}.card-heading{display:flex;align-items:center;gap:8px;margin:-3px 0 8px}.move-controls{display:flex;flex-direction:column;gap:0}.move-btn{background:transparent;color:var(--muted);padding:0 5px;margin:0;font-size:14px;line-height:1.1}.drag-grip{cursor:grab;touch-action:none;color:var(--muted);font-size:24px;line-height:1;padding:4px;user-select:none}.drag-grip:active{cursor:grabbing}.collapse-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;text-align:left;background:transparent;color:var(--ink);padding:4px;margin:0}.app-heading-text{display:flex;flex-direction:column;gap:2px}.app-heading-text strong{font-size:19px}.collapse-chevron{font-size:20px;color:var(--muted);min-width:24px;text-align:center}.card-content[hidden]{display:none!important}.card.dragging{opacity:.45}.card.drag-over{outline:2px dashed var(--purple);outline-offset:2px}.card.collapsed{padding-bottom:12px}
.meta{color:var(--muted);font-size:13px}.stat{display:inline-block;margin:5px 22px 8px 0}.big{font-size:21px;font-weight:800}
.task{display:block;background:#faf8f5;padding:9px;border-radius:9px;margin:6px 0}.task input{width:18px;height:18px;vertical-align:middle}
.info{margin:9px 0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.info code{background:#eee8e2;padding:6px 8px;border-radius:6px;overflow-wrap:anywhere}
input,select,textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;margin:4px 0 10px;font:inherit}
label{font-weight:700;display:block}textarea{resize:vertical}.actions{margin-top:10px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:12px;z-index:10}.modal.show{display:flex}
.box{background:#fff;border-radius:16px;padding:18px;max-width:680px;width:100%;max-height:92vh;overflow:auto}
.day{border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0}.day button{min-width:100px}
.complete{color:var(--green)}.missed{color:var(--red)}.untracked{color:var(--muted)}
.notice{background:#f1eafa;padding:10px;border-radius:9px;font-size:13px;margin:10px 0}
.task-edit{display:flex;gap:6px;margin:6px 0}.task-edit input{flex:1;margin:0}
.empty{text-align:center;color:var(--muted);padding:28px}.brand-header{display:flex;align-items:center;gap:12px;padding:10px 14px}.brand-logo{width:72px;height:72px;object-fit:contain;flex:0 0 72px}.brand-title{min-width:0;flex:1}.brand-title h1{font-size:25px}.brand-tagline{font-size:13px;opacity:.9;margin-top:2px}.header-settings{background:transparent!important;color:#fff!important;font-size:22px;padding:8px;margin:0}.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 14px}.theme-option{padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:left}.theme-option.active{border-color:var(--purple);box-shadow:0 0 0 2px #7046a522}.swatches{display:flex;gap:5px;margin-top:6px}.swatch{width:20px;height:20px;border-radius:50%;border:1px solid #0002}.settings-section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.color-row{display:grid;grid-template-columns:1fr 82px;gap:10px;align-items:center}.color-row input[type=color]{width:82px;height:42px;padding:2px}.preview-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.points-progress{margin:8px 0 4px}.progress-track{height:10px;background:#eee8e2;border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:var(--purple);border-radius:999px;transition:width .2s ease}.progress-label{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
</style>
</head>

<script>
const KEY='streakGoblinFinal';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let apps=JSON.parse(localStorage.getItem(KEY)||'null')||[];
function A(id){return apps.find(a=>a.id===id)}
function contactSupport(){window.open('mailto:StreakGoblin@TheDragonsPantry.com?subject='+encodeURIComponent('Streak Goblin Support'),'_blank')}
function save(){localStorage.setItem(KEY,JSON.stringify(apps));render()}
function status(a,d){return a.history?.[d]||'untracked'}
const CURRENCIES=[['USD','US Dollar','$'],['CAD','Canadian Dollar','CA$'],['GBP','British Pound','£'],['EUR','Euro','€'],['AUD','Australian Dollar','A$'],['NZD','New Zealand Dollar','NZ$'],['JPY','Japanese Yen','¥'],['INR','Indian Rupee','₹'],['MXN','Mexican Peso','MX$'],['BRL','Brazilian Real','R$'],['ZAR','South African Rand','R'],['CHF','Swiss Franc','CHF'],['CNY','Chinese Yuan','¥'],['SEK','Swedish Krona','kr'],['NOK','Norwegian Krone','kr'],['DKK','Danish Krone','kr'],['SGD','Singapore Dollar','S$'],['HKD','Hong Kong Dollar','HK$']];
function currencyCode(){return settings.currency||'USD'}
function money(v){const c=currencyCode();try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(Number(v||0))}catch{return `${CURRENCIES.find(x=>x[0]===c)?.[2]||c}${Number(v||0).toFixed(2)}`}}
function isMoney(a){return a.unit==='currency'}
function unitName(a){return isMoney(a)?currencyCode():'points'}
function unitAmount(a,v){return isMoney(a)?money(v):String(Number(v||0))}
function unitLabel(a){return isMoney(a)?CURRENCIES.find(x=>x[0]===currencyCode())?.[1]||currencyCode():'Points'}

/* Streak model:
   - baseStreak is the imported/current streak at baseDate.
   - Complete increments it.
   - Missed resets it to zero, then later Complete days build it back up.
   - Not Tracked changes nothing at all.
*/
function calcStreak(a){
  const base=Number.isFinite(a.baseStreak)?a.baseStreak:(a.streak||0);
  const baseDate=a.baseDate||today();
  const entries=Object.entries(a.history||{})
    .filter(([d,s])=>d<=today() && (s==='complete'||s==='missed'))
    .sort((x,y)=>x[0].localeCompare(y[0]));

  // A historical Missed day is an explicit reset, even if it is before
  // the imported streak's base date. Not Tracked days never enter this list.
  let n=base;
  let lastMissed=null;
  for(const [d,s] of entries) if(s==='missed') lastMissed=d;

  if(lastMissed){
    n=0;
    for(const [d,s] of entries){
      if(d>lastMissed && s==='complete') n++;
    }
    return n;
  }

  // No explicit miss anywhere: retain the imported streak and add only
  // completed days recorded after the imported baseline date.
  for(const [d,s] of entries){
    if(d>baseDate && s==='complete') n++;
  }
  return n;
}
let draggedAppId=null;
function toggleCollapse(id){const a=A(id);if(!a)return;a.collapsed=!a.collapsed;save()}
function moveApp(id,delta){const from=apps.findIndex(a=>a.id===id),to=from+delta;if(from<0||to<0||to>=apps.length)return;const [item]=apps.splice(from,1);apps.splice(to,0,item);save()}
function dragStart(event,id){draggedAppId=id;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',id);event.currentTarget.classList.add('dragging')}
function dragEnd(event){event.currentTarget.classList.remove('dragging');draggedAppId=null;document.querySelectorAll('.card.drag-over').forEach(el=>el.classList.remove('drag-over'))}
function dragOver(event){event.preventDefault();event.dataTransfer.dropEffect='move';event.currentTarget.classList.add('drag-over')}
function dragLeave(event){if(!event.currentTarget.contains(event.relatedTarget))event.currentTarget.classList.remove('drag-over')}
function dropApp(event,targetId){event.preventDefault();event.currentTarget.classList.remove('drag-over');const sourceId=draggedAppId||event.dataTransfer.getData('text/plain');if(!sourceId||sourceId===targetId)return;const from=apps.findIndex(a=>a.id===sourceId),to=apps.findIndex(a=>a.id===targetId);if(from<0||to<0)return;const [item]=apps.splice(from,1);apps.splice(to,0,item);save()}
function render(){
 const done=apps.filter(a=>status(a,today())==='complete').length;
 dashboard.innerHTML=`<div class="stat"><span class="big">📱 ${done} / ${apps.length}</span><br><span class="meta">Today's apps completed</span></div>`;
 list.innerHTML=apps.length?apps.map(a=>`
 <div class="card ${a.collapsed?'collapsed':''}" data-app-id="${a.id}" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropApp(event,'${a.id}')">

function toggleTask(id,tid){const a=A(id);const t=a?.tasks.find(x=>x.id===tid);if(t)t.done=!t.done;save()}

function hideModal(){document.getElementById('modal').classList.remove('show')}

  baseStreak:starting+(yes&&starting===0?1:0),streak:starting+(yes&&starting===0?1:0),baseDate:yes?today():addDays(today(),-1),history:{},tasks:tasks.length?tasks:[{id:crypto.randomUUID(),name:'Daily check-in',done:false}],

  balance:+(document.getElementById('bal')?.value||0),goal:+(document.getElementById('goal')?.value||0),unit:document.querySelector('input[name=unit]:checked')?.value||'points',trackStreak:document.getElementById('trackStreak')?.checked??true,cashouts:[],earnings:{}};
 if(yes)a.history[today()]='complete';

 document.getElementById('etype').value=a.type||'streak';
 document.getElementById('etype').addEventListener('change',e=>document.getElementById('editRewardFields').style.display=(e.target.value==='rewards'||e.target.value==='receipts')?'block':'none');
 document.querySelectorAll('input[name=eunit]').forEach(el=>el.addEventListener('change',()=>{const m=document.querySelector('input[name=eunit]:checked')?.value==='currency';document.getElementById('ebLabel').firstChild.textContent=m?'Current Currency Balance':'Current Points';document.getElementById('egLabel').firstChild.textContent=m?'Goal Amount':'Goal Points'}));

function addEditTask(){const d=document.createElement('div');d.className='task-edit';d.innerHTML='<input type="text" placeholder="Another task"><button type="button" class="danger small" onclick="this.parentElement.remove()">×</button>';document.getElementById('editTasks').appendChild(d)}
function saveEdit(id){
 const a=A(id);a.name=document.getElementById('en').value.trim()||a.name;const oldType=a.type;a.type=document.getElementById('etype').value;a.unit=document.querySelector('input[name=eunit]:checked')?.value||a.unit||'points';a.trackStreak=document.getElementById('editTrackStreak')?.checked??(a.trackStreak??true);a.baseStreak=+(document.getElementById('es').value||0);if(a.type==='rewards'||a.type==='receipts'){a.balance=+(document.getElementById('eb')?.value??a.balance??0);a.goal=+(document.getElementById('eg')?.value??a.goal??0)}

function deleteApp(id){const a=A(id);if(!a)return;if(confirm(`Delete "${a.name}" and all of its Streak Goblin history? This cannot be undone.`)){apps=apps.filter(x=>x.id!==id);hideModal();save()}}
function week(id){
 const a=A(id);if(!a)return;
 let days='';for(let i=6;i>=0;i--){const d=addDays(today(),-i),s=status(a,d);days+=`<div class="day"><b>${fmt(d)}</b> — <span class="${s}">${s==='complete'?'🟢 Complete':s==='missed'?'🔴 Missed':'⚪ Not Tracked'}</span><br><button onclick="setDay('${id}','${d}','complete')">Complete</button><button class="danger" onclick="setDay('${id}','${d}','missed')">Missed</button><button class="secondary" onclick="setDay('${id}','${d}','untracked')">Not Tracked</button></div>`}
 openModal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>📅 Week View — ${esc(a.name)}</h2><button class="secondary" onclick="hideModal()">✕ Close</button></div><div class="notice">🟢 Complete advances the streak. 🔴 Missed resets the streak. ⚪ Not Tracked is neutral and does NOT reset or change the streak.</div>${days}<button class="secondary" onclick="hideModal()">← Back to Apps</button>`);
}
function setDay(id,d,v){const a=A(id);if(v==='untracked')delete a.history[d];else a.history[d]=v;save();week(id)}
function points(id){const a=A(id);openModal(`<h2>💰 Enter Ending ${isMoney(a)?'Balance':'Points'}</h2><p>Starting balance: <b>${unitAmount(a,a.balance)}</b></p><label>Ending balance<input id="ep" type="number" min="0" step="0.01" value="${a.balance||0}"></label><button onclick="savePoints('${id}')">Calculate & Save</button><button class="secondary" onclick="hideModal()">Cancel</button>`)}
function savePoints(id){const a=A(id),end=+(document.getElementById('ep').value||0),start=+(a.balance||0);a.earnings[today()]=(a.earnings[today()]||0)+(end-start);a.balance=end;hideModal();save()}
function changeGoal(id){const a=A(id);openModal(`<h2>🎯 Change Goal</h2><p>Current goal: <b>${unitAmount(a,a.goal)}</b></p><label>${isMoney(a)?'Goal Amount':'Goal Points'}<input id="ng" type="number" min="0" step="0.01" value="${a.goal||0}"></label><button onclick="saveGoal('${id}')">Save Goal</button><button class="secondary" onclick="hideModal()">Cancel</button>`)}
function saveGoal(id){A(id).goal=+(document.getElementById('ng').value||0);hideModal();save()}
function cashout(id){const a=A(id);openModal(`<h2>💵 Cash Out</h2><p>Current points: <b>${a.balance||0}</b></p><label>Points Redeemed<input id="cp" type="number" min="0"></label><label>Dollar Amount<input id="cd" type="number" min="0" step="0.01"></label><label>Cashout Type<select id="ct"><option value="Gift Card">Gift Card</option><option value="AHC">AHC</option></select></label><label>Specifics / Notes<span class="meta"> (optional)</span><textarea id="cn" rows="3" placeholder="e.g. Walmart or Venmo"></textarea></label><button onclick="saveCashout('${id}')">Record Cash-Out</button><button class="secondary" onclick="hideModal()">Cancel</button>`)}
function saveCashout(id){
 const a=A(id),p=+(document.getElementById('cp').value||0),d=+(document.getElementById('cd').value||0);
 if(p<=0)return alert('Enter the points redeemed.');
 if(d<0)return alert('Dollar amount cannot be negative.');
 if(p>a.balance)return alert('Not enough points.');
 a.balance-=p;
 a.cashouts=a.cashouts||[];
 a.cashouts.push({date:today(),points:p,dollars:d,type:document.getElementById('ct')?.value||'Gift Card',note:document.getElementById('cn')?.value.trim()||'',remaining:a.balance});
 hideModal();save()
}
function cashoutHistory(id){
 const a=A(id);if(!a)return;
 a.cashouts=a.cashouts||[];
 const totalD=a.cashouts.reduce((sum,x)=>sum+Number(x.dollars||0),0);
 const totalP=a.cashouts.reduce((sum,x)=>sum+Number(x.points||0),0);
 const rows=a.cashouts.slice().reverse().map((x,i)=>{
   const cumulative=a.cashouts.slice(0,a.cashouts.indexOf(x)+1).reduce((sum,y)=>sum+Number(y.dollars||0),0);
   return `<div class="day"><b>Cash Out #${a.cashouts.length-i}</b> — ${fmt(x.date)}<br>💵 <b>$${Number(x.dollars||0).toFixed(2)}</b> &nbsp; • &nbsp; 💰 ${Number(x.points||0)} points redeemed<br>📦 <b>${esc(x.type||'Gift Card')}</b>${x.note?` &nbsp; • &nbsp; 📝 ${esc(x.note)}`:''}<br><span class="meta">Points remaining: ${Number(x.remaining||0)} &nbsp; • &nbsp; Total cashed out through this transaction: $${cumulative.toFixed(2)}</span></div>`;
 }).join('');
 openModal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>📜 Cash Out History — ${esc(a.name)}</h2><button class="secondary" onclick="hideModal()">✕ Close</button></div><div class="stat"><span class="big">$${totalD.toFixed(2)}</span><br><span class="meta">Total cashed out</span><br><span class="meta">${totalP} total points redeemed · ${a.cashouts.length} cash-out${a.cashouts.length===1?'':'s'}</span></div>${rows||'<div class="empty">No cash-outs recorded yet.</div>'}<button class="secondary" onclick="hideModal()">← Back to App</button>`)
}
function copyValue(v){navigator.clipboard?.writeText(v).then(()=>alert('Copied!')).catch(()=>prompt('Copy this value:',v))}

}

function saveCurrencySetting(){const el=document.getElementById('setCurrency');if(el){settings.currency=el.value;localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));render();}}

  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
  applySettings();
  settingsBeforeModal=null;
  hideModal();
}
function previewColors(bg,btn,acc){
  const root=document.documentElement;
  root.style.setProperty('--bg',bg);
  root.style.setProperty('--purple',btn);
  root.style.setProperty('--green',acc);
  root.style.setProperty('--accent',acc);
  const preview=document.getElementById('settingsPreview');
  const previewBtn=document.getElementById('settingsPreviewButton');
  if(preview) preview.style.background=bg;
  if(previewBtn) previewBtn.style.background=btn;
}
function chooseTheme(name){
  settings.theme=name;
  settings.custom=false;
  settings.bg=null;
  settings.button=null;
  settings.accent=null;
  applySettings();
  openSettings(true);
}
function openSettings(reopen=false){
  if(!settingsBeforeModal && !reopen){
    settingsBeforeModal=JSON.parse(JSON.stringify(settings));
  }
  const t=currentTheme();
  const bg=settings.custom&&settings.bg?settings.bg:t.bg;
  const btn=settings.custom&&settings.button?settings.button:t.button;
  const acc=settings.custom&&settings.accent?settings.accent:t.accent;
  const currencyOptions=CURRENCIES.map(([code,name,symbol])=>`<option value="${code}" ${currencyCode()===code?'selected':''}>${name} (${symbol})</option>`).join('');
  const themeButtons=Object.entries(THEME_PRESETS).map(([k,p])=>`<button type="button" class="theme-option ${settings.theme===k&&!settings.custom?'active':''}" onclick="chooseTheme('${k}')"><b>${esc(p.name)}</b><div class="swatches"><span class="swatch" style="background:${p.bg}"></span><span class="swatch" style="background:${p.button}"></span><span class="swatch" style="background:${p.header}"></span></div></button>`).join('');
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>⚙️ App Settings</h2><button class="secondary" onclick="cancelSettings()">✕ Close</button></div>
    <div class="settings-section" style="border-top:0;padding-top:0"><h3>💱 Currency</h3><label>Currency used for money-based apps<select id="setCurrency">${currencyOptions}</select></label><p class="meta">This changes how amounts are displayed; it does not convert or change saved values.</p><button type="button" class="secondary" onclick="saveCurrencySetting()">Save Currency</button></div>
    <div class="settings-section"><h3>🎨 Themes</h3><div class="theme-grid">${themeButtons}</div></div>
    <div class="settings-section"><h3>✨ Custom Appearance</h3>
      <label class="color-row">Background Color<input id="setBg" type="color" value="${bg}" oninput="liveCustomColors()"></label>
      <label class="color-row">Button Color<input id="setBtn" type="color" value="${btn}" oninput="liveCustomColors()"></label>
      <label class="color-row">Accent Color<input id="setAcc" type="color" value="${acc}" oninput="liveCustomColors()"></label>
      <p class="meta">Pick your colors above. The preview updates instantly.</p>
    </div>
    <div id="settingsPreview" class="preview-box"><b>Preview</b><div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button id="settingsPreviewButton" type="button">Example Button</button></div></div>
    <div class="actions"><button onclick="applyCustomSettings()">Save Appearance</button><button class="secondary" onclick="cancelSettings()">Cancel</button></div>`);
  const pb=document.getElementById('settingsPreview');
  const pbtn=document.getElementById('settingsPreviewButton');
  if(pb) pb.style.background=bg;
  if(pbtn) pbtn.style.background=btn;
}
function liveCustomColors(){
  const bg=document.getElementById('setBg'),btn=document.getElementById('setBtn'),acc=document.getElementById('setAcc');
  if(!bg||!btn||!acc)return;
  settings.custom=true;
  settings.bg=bg.value;
  settings.button=btn.value;
  settings.accent=acc.value;
  previewColors(bg.value,btn.value,acc.value);
}
function applyCustomSettings(){
  liveCustomColors();
  saveSettings();
}
function cancelSettings(){
  if(settingsBeforeModal){
    settings=JSON.parse(JSON.stringify(settingsBeforeModal));
    applySettings();
    settingsBeforeModal=null;
  }
  hideModal();
}

function resetDemo(){if(confirm('Reset all test data?')){localStorage.removeItem(KEY);location.reload()}}
applySettings();
render();
</script>
</body>
